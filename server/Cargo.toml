[package]
name = "photosift"
version = "0.1.0"
edition = "2021"
description = "PhotoSift localhost server"
default-run = "photosift"

[lib]
name = "photosift"
path = "src/lib.rs"

[[bin]]
name = "photosift"
path = "src/main.rs"

[[bin]]
name = "photosift-eval"
path = "src/bin/eval.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fast_image_resize = "5"
jpeg-encoder = "0.6"
kamadak-exif = "0.6"
ort = { version = "=2.0.0-rc.12", features = ["cuda"] }
quick-xml = "0.36"
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
trash = "5.2.9"
uuid = { version = "1", features = ["v4"] }
zune-jpeg = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"

# Dev-profile codegen for JPEG decode/encode and resizing is 5-10x slower than
# release; bumping just these crates keeps ingest and tests usable in debug.
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3

# ONNX inference in dev profile is >1 s/image without these (measured on the earlier prototype).
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ort-sys]
opt-level = 3
