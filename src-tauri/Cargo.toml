[package]
name = "photosift"
version = "0.1.0"
edition = "2021"

[lib]
name = "photosift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rawler = "0.7"
image = { version = "0.25", features = ["jpeg", "tiff", "png"] }
kamadak-exif = "0.5"
quick-xml = "0.36"
rayon = "1.10"
lru = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
http = "1"
dirs = "5"
walkdir = "2"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
uuid = { version = "1", features = ["v4"] }
ort = { version = "=2.0.0-rc.12", features = ["cuda"] }
zune-jpeg = "0.4"
ndarray = "0.16"
crossbeam-channel = "0.5"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
# Curator subsystem (Anthropic Messages API). reqwest with rustls-tls
# avoids needing OpenSSL on Linux; the `json` feature gives us the
# typed body/response helpers. We use Tauri's existing tokio runtime,
# but pull tokio in explicitly so we can use `sync::Semaphore` and
# `time::sleep` for retry backoff in `curator/api.rs`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "macros"] }
# OS keychain storage for the user's Anthropic API key. Service name
# `"photosift"` (release) or `"photosift-dev"` (debug builds — see
# `curator/mod.rs`), account `"anthropic_api_key"`. Stored only via
# `commands::curator::set_anthropic_api_key`; never returned to the
# frontend after write.
#
# CRITICAL: keyring 3.x defaults to a mock backend unless you opt into a
# platform-native one. Without these features, set_password() succeeds
# silently but get_password() returns NoEntry — a write-only black hole.
# Enable native backends for the three desktop targets we ship to.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
# Pure-Rust JPEG encoder. The `image` crate's built-in encoder is
# significantly slower (2-3s to encode a 24MP preview at quality 92);
# this one is SIMD-optimised where the target supports it and brings
# that down to ~400-800ms. Used in the rotation re-encode hot path.
jpeg-encoder = "0.7"

# Dev-only MCP bridge: embeds an MCP server inside the Tauri app so
# Claude Code can take screenshots, read the DOM, and execute JS in
# the webview for programmatic UI verification. Registered only under
# `#[cfg(debug_assertions)]` in `lib.rs`, so release builds don't ship
# it. TCP mode (127.0.0.1:4000) sidesteps the plugin's Unix-socket
# default, which is awkward on Windows.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", features = ["devtools"] }

[dev-dependencies]
tempfile = "3"

# Optimize hot-path crates in dev builds. Without these overrides, ORT
# inference in `cargo tauri dev` takes >1s per image because debug
# codegen for the inference runtime + image preprocessing is 5-10x
# slower than release. Bumping opt-level for just these crates keeps
# our own edit-compile loop fast while letting the actual heavy work
# run at full speed.
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ort-sys]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.rawler]
opt-level = 3
[profile.dev.package."jpeg-decoder"]
opt-level = 3
# Our own crate at opt-level 2 in dev. The AI worker's inner loops
# (letterbox tensor build, NMS, Laplacian reduce) spend a meaningful
# chunk of time in bounds-checked indexed writes; opt-level 2 is
# enough for LLVM to hoist those checks out without pushing compile
# times into release-build territory (3 makes link-time balloon).
[profile.dev.package.photosift]
opt-level = 2
# Faster JPEG encoder library we added in this session.
[profile.dev.package.jpeg-encoder]
opt-level = 3
