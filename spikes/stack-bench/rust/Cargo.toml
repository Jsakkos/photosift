[package]
name = "stack-bench-rs"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
zune-jpeg = "0.4"
jpeg-encoder = "0.6"
fast_image_resize = "5"
kamadak-exif = "0.5"
ort = { version = "=2.0.0-rc.12", features = ["cuda"] }
anyhow = "1"

[profile.release]
debug = false
codegen-units = 16
