name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ort downloads its ONNX Runtime binaries during the cargo build, so these need network.
      # No ONNX models exist on the runner, so the enrichment tests exercise the unavailable
      # path; the golden tests are #[ignore] and are not run.
      - name: cargo fmt
        run: cargo fmt --manifest-path server/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path server/Cargo.toml

      - name: npm ci
        run: npm --prefix web ci

      - name: web unit tests
        run: npm --prefix web run test

      - name: web build
        run: npm --prefix web run build

      - name: install Playwright Chromium
        run: npx --prefix web playwright install chromium

      # The Playwright global setup rebuilds the server and the web bundle, both cached by now.
      - name: web e2e
        run: npm --prefix web run e2e

      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
